version: '3.8'

services:
  keycloak:
    environment:
      - KC_PROXY=edge
      - KC_HOSTNAME_STRICT=true
      - KC_HOSTNAME_STRICT_HTTPS=true
      - KC_HOSTNAME_STRICT_BACKCHANNEL=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`auth.yourdomain.com`)"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.routers.keycloak.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.keycloak-secure.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.keycloak-secure.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.keycloak-secure.headers.stsPreload=true"
      - "traefik.http.middlewares.keycloak-secure.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.keycloak-secure.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.keycloak-secure.headers.browserXssFilter=true"
      - "traefik.http.middlewares.keycloak-secure.headers.customFrameOptionsValue=SAMEORIGIN"

  postgres:
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local